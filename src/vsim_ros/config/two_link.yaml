# 两连杆机械臂（2 关节）：逆动力学前馈 + 路径点规划（最小加加速度）。
sim_host:
  ros__parameters:
    use_sim_time: false
    plant:
      model:
        type: two_link
        joint_names: [joint1, joint2]
      drive:
        effort_limit: [20.0, 10.0]
      integrator: rk4
    sensor:
      position_noise_std: 0.0001
      seed: 42
    sim:
      dt: 0.001
      lockstep: true
      realtime_factor: 1.0
      resend_timeout: 0.1        # lockstep：多久没收到 ECU 回应就重发当前帧（秒）
      max_lag: 0.1               # 落后墙钟排程超过该值则重新锚定（秒）
    io:
      mode: ros
      can:
        node_ids: [1, 2]
    viz:
      joint_state_decimation: 10

ecu:
  ros__parameters:
    use_sim_time: true
    ecu:
      auto_enable: true
      safe_output: damping
      safe_damping: [2.0, 1.0]
      ref_blend_time: 1.0
    model:
      type: two_link
      joint_names: [joint1, joint2]
    controller:
      type: joint_pd
      kp: [80.0, 60.0]
      kd: [8.0, 2.5]
      ki: [0.0]
      effort_limit: [20.0, 10.0]
      feedforward: inverse_dynamics
    safety:
      velocity_max: [20.0]
      tracking_error_max: 0.5
      estop:
        type: sim
    telemetry:
      decimation: 10
    runtime:
      read_timeout: 0.1
      max_consecutive_timeouts: 5
    io:
      backend: ros_sim
      can:
        node_ids: [1, 2]
        codec: simple
        sync_master: bus

planner:
  ros__parameters:
    use_sim_time: true
    type: waypoints
    joint_names: [joint1, joint2]
    waypoints: "0.0, 0.0; 0.8, -0.6; -0.5, 0.9; 0.3, 0.3"
    segment_time: [1.5]
    loop: true
    scheduler:
      period: 0.2
      horizon: 1.0
      step: 0.05
