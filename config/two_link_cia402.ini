# 两连杆 + 路径点规划（最小加加速度），ECU 与虚拟驱动器之间走进程内虚拟 CAN、CiA 402 协议：
# ECU 侧执行的正是将来对接真实伺服驱动器的 CanMotorIo + Cia402Codec 代码路径（使能状态机、PDO 编解码、量化）。
# 用法（两连杆预设要用 --model 选）：
#   vsim_standalone --model two_link --config config/two_link_cia402.ini --duration 12 --max-rms 0.01

[ecu.io]
backend = can

[ecu.io.can]
interface = virtual:two_link
codec = cia402
node_ids = 1,2
sync_master = bus              # 仿真：由仿真侧发 SYNC（lockstep）；实机改为 ecu

[ecu.io.can.cia402]
sync_with_time = true          # 仿真专用：SYNC 携带仿真时间（非标准），实机上保持 false
rated_torque = 20.0            # 力矩按额定值的千分比传输 → 分辨率 20 mN·m
counts_per_rad = 20860.756     # 131072 counts/rev

[planner]
type = waypoints
joint_names = joint1,joint2
waypoints = 0.0, 0.0; 0.8, -0.6; -0.5, 0.9; 0.3, 0.3
segment_time = 1.5
loop = true
