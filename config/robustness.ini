# 鲁棒性场景（单摆）：模型失配 + 传感器噪声/量化/延迟 + 执行器滞后 + 预置扰动与故障。
# 叠加在默认配置之上（只写与默认值不同的键）。用法：
#   vsim_standalone --config config/robustness.ini --duration 12 --max-rms 0.02 --csv robustness.csv
# 固定随机种子（sim_host.sensor.seed）下结果逐位可复现；改种子即可做蒙特卡洛。

[sim_host.plant.model]
mass = 1.15                    # 真实负载比 ECU 认知的重 15%（ECU 仍按 [ecu.model] 的 1.0 kg 做重力前馈）
damping = 0.08

[sim_host.plant.drive]
torque_time_constant = 0.002   # 驱动器电流环等效 2 ms 一阶滞后

[sim_host.sensor]
position_noise_std = 5e-4
position_resolution = 1.9e-4   # ≈ 15 位单圈编码器（2π / 2^15）
velocity_noise_std = 5e-3
delay_steps = 1                # 一个采样周期的传感延迟
seed = 7

[sim_host]
# 4 s 时 0.3 s 的 1.5 N·m 冲击扰动；7 s 起执行器出力降到 70%，持续 2 s
faults = torque_disturbance joint=0 value=1.5 start=4 duration=0.3; actuator_weak joint=0 value=0.7 start=7 duration=2
